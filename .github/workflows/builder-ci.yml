name: Builder CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-linux:
    name: Build & Test Linux Builder
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Builder/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            wget \
            curl \
            file

      - name: Install appimagetool
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Generate Integrity Manifest
        run: |
          python3 scripts/integrity.py --write-version || true
          python3 scripts/integrity.py --make

      - name: Bundle Builder Assets (Build Time)
        run: |
          python3 scripts/bundle_builder_assets.py

      - name: Run Go Unit Tests
        run: |
          cd Builder
          go test -v ./...

      - name: Build SplatPC-Builder Executable and AppImage
        run: |
          cd Builder
          go build -trimpath -ldflags="-s -w" -o splatpc-builder .
          ./splatpc-builder -check || true
          cd ..

          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"

          cp Builder/splatpc-builder "$APPDIR/usr/bin/splatpc-builder"
          chmod +x "$APPDIR/usr/bin/splatpc-builder"

          printf '#!/usr/bin/env bash\nHERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"\nexport PATH="$HERE/usr/bin:$PATH"\nexec "$HERE/usr/bin/splatpc-builder" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=SplatPC Builder"
            echo "Exec=AppRun"
            echo "Icon=splatpc-builder"
            echo "Comment=Native Splatoon PC Port Builder and Setup"
            echo "Categories=Game;Development;Utility;"
            echo "Terminal=false"
            echo "StartupNotify=true"
          } > "$APPDIR/splatpc-builder.desktop"

          cp Builder/ui/icon.png "$APPDIR/splatpc-builder.png"
          cp Builder/ui/icon.png "$APPDIR/.DirIcon"
          cp Builder/ui/icon.png "$APPDIR/usr/share/icons/hicolor/128x128/apps/splatpc-builder.png"

          ARCH=x86_64 appimagetool -n "$APPDIR" SplatPC-Builder-x86_64.AppImage
          chmod +x SplatPC-Builder-x86_64.AppImage
          test -f SplatPC-Builder-x86_64.AppImage

      - name: Test Userspace Dependency Download, Build & Cleanup (Linux)
        env:
          SPLATPC_TOOLS_DIR: ${{ runner.temp }}/splatpc-userspace-tools
          SPLATPC_USERSPACE_ONLY: "1"
        run: |
          rm -rf "$SPLATPC_TOOLS_DIR"
          ./Builder/splatpc-builder --install-deps
          ./Builder/splatpc-builder -check
          ./Builder/splatpc-builder --build-runtime

          ./build/rebrewu/bin/rebrewu manifest verify --manifest Manifest/Gambit_v16.manifest
          "$SPLATPC_TOOLS_DIR/cmake/bin/ctest" --test-dir build/port --output-on-failure \
            -R "^(native_texture_pack|native_nn_nfp|native_quit_confirm|native_mouse_camera|weather_math)$"

          ./Builder/splatpc-builder --cleanup-deps
          test ! -d "$SPLATPC_TOOLS_DIR"
          test ! -d build/downloads
          test ! -d build/deps
          test ! -d build/rebrewu
          test ! -d build/port

      - name: Upload Linux Builder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: splatpc-builder-linux-ci
          path: SplatPC-Builder-x86_64.AppImage
          retention-days: 1

  build-and-test-windows:
    name: Build & Test Windows Builder
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Builder/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add MinGW64 to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Integrity Manifest
        shell: pwsh
        run: |
          python scripts/integrity.py --write-version
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          python scripts/integrity.py --make

      - name: Bundle Builder Assets (Build Time)
        shell: pwsh
        run: |
          python scripts/bundle_builder_assets.py

      - name: Run Go Unit Tests
        shell: pwsh
        run: |
          cd Builder
          go test -v ./...

      - name: Build SplatPC-Builder.exe
        shell: pwsh
        run: |
          cd Builder
          $env:CGO_ENABLED = "1"
          go generate ./winres.go
          go build -trimpath -ldflags="-H windowsgui -s -w" -o ../SplatPC-Builder.exe .
          go build -trimpath -ldflags="-s -w" -o splatpc-builder-cli.exe .
          cd ..
          if (-not (Test-Path SplatPC-Builder.exe)) {
            throw "SplatPC-Builder.exe was not created"
          }

      - name: Test Userspace Dependency Download, Build & Cleanup (Windows)
        shell: pwsh
        env:
          SPLATPC_TOOLS_DIR: ${{ runner.temp }}\splatpc-userspace-tools
          SPLATPC_USERSPACE_ONLY: "1"
        run: |
          if (Test-Path $env:SPLATPC_TOOLS_DIR) { Remove-Item -Recurse -Force $env:SPLATPC_TOOLS_DIR }
          .\Builder\splatpc-builder-cli.exe --install-deps
          if ($LASTEXITCODE -ne 0) { throw "--install-deps failed" }
          .\Builder\splatpc-builder-cli.exe -check
          if ($LASTEXITCODE -ne 0) { throw "-check failed" }
          .\Builder\splatpc-builder-cli.exe --build-runtime
          if ($LASTEXITCODE -ne 0) { throw "--build-runtime failed" }

          .\build\rebrewu\bin\rebrewu.exe manifest verify --manifest Manifest/Gambit_v16.manifest
          if ($LASTEXITCODE -ne 0) { throw "Manifest verify failed" }
          & "$env:SPLATPC_TOOLS_DIR\cmake\bin\ctest.exe" --test-dir build/port -C Release --output-on-failure `
            -R "^(native_texture_pack|native_nn_nfp|native_quit_confirm|native_mouse_camera|weather_math)$"
          if ($LASTEXITCODE -ne 0) { throw "CTest failed" }

          .\Builder\splatpc-builder-cli.exe --cleanup-deps
          if ($LASTEXITCODE -ne 0) { throw "--cleanup-deps failed" }
          if (Test-Path $env:SPLATPC_TOOLS_DIR) { throw "SPLATPC_TOOLS_DIR was not deleted" }
          if (Test-Path build/downloads) { throw "build/downloads was not deleted" }
          if (Test-Path build/deps) { throw "build/deps was not deleted" }
          if (Test-Path build/rebrewu) { throw "build/rebrewu was not deleted" }
          if (Test-Path build/port) { throw "build/port was not deleted" }

      - name: Upload Windows Builder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: splatpc-builder-windows-ci
          path: SplatPC-Builder.exe
          retention-days: 1
