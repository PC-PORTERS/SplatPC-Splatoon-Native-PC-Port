name: Release

on:
  release:
    types: [published]
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (leave empty to auto-detect)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    # Online releases (tags online-*) ship no standalone Builder: it cannot prove its files to the server yet.
    if: ${{ !startsWith(github.event.release.tag_name || github.event.inputs.tag || github.ref_name, 'online-') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Builder/go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            wget \
            curl \
            file

      - name: Install appimagetool
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Bundle Builder Assets
        run: |
          python3 scripts/bundle_builder_assets.py

      - name: Build SplatPC-Builder AppImage
        run: |
          cd Builder
          go build -trimpath -ldflags="-s -w" -o splatpc-builder .
          cd ..

          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"

          cp Builder/splatpc-builder "$APPDIR/usr/bin/splatpc-builder"
          chmod +x "$APPDIR/usr/bin/splatpc-builder"
          cp recomplauncher.json "$APPDIR/recomplauncher.json"

          printf '#!/usr/bin/env bash\nHERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"\nexport PATH="$HERE/usr/bin:$PATH"\nexec "$HERE/usr/bin/splatpc-builder" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=SplatPC Builder"
            echo "Exec=AppRun"
            echo "Icon=splatpc-builder"
            echo "Comment=Native Splatoon PC Port Builder and Setup"
            echo "Categories=Game;Development;Utility;"
            echo "Terminal=false"
            echo "StartupNotify=true"
          } > "$APPDIR/splatpc-builder.desktop"

          python3 -c '
          import zlib, struct
          w, h = 128, 128
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  if 8 <= x <= 120 and 8 <= y <= 120:
                      if 14 <= x <= 114 and 14 <= y <= 114:
                          raw.extend([0, 212, 170, 255])
                      else:
                          raw.extend([20, 24, 33, 255])
                  else:
                      raw.extend([20, 24, 33, 255])
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(bytes(raw))) + chunk(b"IEND", b"")
          with open("AppDir/splatpc-builder.png", "wb") as f: f.write(png)
          with open("AppDir/.DirIcon", "wb") as f: f.write(png)
          with open("AppDir/usr/share/icons/hicolor/128x128/apps/splatpc-builder.png", "wb") as f: f.write(png)
          '

          ARCH=x86_64 appimagetool -n "$APPDIR" SplatPC-Builder-x86_64.AppImage
          chmod +x SplatPC-Builder-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: splatpc-builder-linux
          path: SplatPC-Builder-x86_64.AppImage
          retention-days: 1

  build-windows:
    name: Build Windows Standalone EXE
    # Online releases (tags online-*) ship no standalone Builder: it cannot prove its files to the server yet.
    if: ${{ !startsWith(github.event.release.tag_name || github.event.inputs.tag || github.ref_name, 'online-') }}
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Builder/go.sum

      - name: Add MinGW64 to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bundle Builder Assets
        shell: pwsh
        run: |
          python scripts/bundle_builder_assets.py

      - name: Build SplatPC-Builder.exe
        shell: pwsh
        run: |
          cd Builder
          $env:CGO_ENABLED = "1"
          go build -trimpath -ldflags="-H windowsgui -s -w" -o ../SplatPC-Builder.exe .

      - name: Package Windows release zip
        shell: pwsh
        run: |
          Compress-Archive -Force -Path SplatPC-Builder.exe, recomplauncher.json -DestinationPath SplatPC-Builder-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: splatpc-builder-windows
          path: SplatPC-Builder-Windows-x64.zip
          retention-days: 1

  publish:
    name: Publish Builder Binaries to Release
    # Online releases (tags online-*) ship no standalone Builder: it cannot prove its files to the server yet.
    if: ${{ !startsWith(github.event.release.tag_name || github.event.inputs.tag || github.ref_name, 'online-') }}
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: splatpc-builder-linux
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: splatpc-builder-windows
          path: release-assets

      - name: Determine Release Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v-dev-${GITHUB_SHA::7}")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum SplatPC-Builder-x86_64.AppImage SplatPC-Builder-Windows-x64.zip > SHA256SUMS.txt
          cp SHA256SUMS.txt SHA256SUMS-BUILDER.txt
          cat SHA256SUMS.txt

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Splatoon 1 PC Port ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## SplatPC Builder

            | Platform | File | Instructions |
            |---|---|---|
            | Windows 10/11 (x64) | `SplatPC-Builder-Windows-x64.zip` | Unzip and run `SplatPC-Builder.exe` |
            | Linux (x64) | `SplatPC-Builder-x86_64.AppImage` | `chmod +x SplatPC-Builder-x86_64.AppImage && ./SplatPC-Builder-x86_64.AppImage` |

            The builder tool automatically configures prerequisites, verifies your Splatoon dump, and compiles the native PC port.
            No game files are included (you need your own dump of Splatoon).
            Works with [RecompLauncher](https://recomplauncher.com): install, set up and start the port from the launcher.
            Checksums: `SHA256SUMS.txt`.
          files: |
            release-assets/SplatPC-Builder-x86_64.AppImage
            release-assets/SplatPC-Builder-Windows-x64.zip
            release-assets/SHA256SUMS.txt
            release-assets/SHA256SUMS-BUILDER.txt
            recomplauncher.json
