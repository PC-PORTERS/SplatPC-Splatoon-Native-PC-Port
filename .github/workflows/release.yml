name: Release

on:
  release:
    types: [published]
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (leave empty to auto-detect)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Builder/go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            wget \
            curl \
            file

      - name: Install appimagetool
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Generate Integrity Manifest
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 scripts/integrity.py --make "$TAG"

      - name: Bundle Builder Assets
        run: |
          python3 scripts/bundle_builder_assets.py

      - name: Build SplatPC-Builder AppImage
        run: |
          cd Builder
          LDFLAGS="-s -w"
          if [ -n "${{ steps.version.outputs.tag }}" ]; then
            LDFLAGS="$LDFLAGS -X 'splatpc-builder/engine.ReleaseTag=${{ steps.version.outputs.tag }}'"
          fi
          go build -trimpath -ldflags="$LDFLAGS" -o splatpc-builder .
          cd ..

          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"

          cp Builder/splatpc-builder "$APPDIR/usr/bin/splatpc-builder"
          chmod +x "$APPDIR/usr/bin/splatpc-builder"
          cp recomplauncher.json "$APPDIR/recomplauncher.json"

          printf '#!/usr/bin/env bash\nHERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"\nexport PATH="$HERE/usr/bin:$PATH"\nexec "$HERE/usr/bin/splatpc-builder" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=SplatPC Builder"
            echo "Exec=AppRun"
            echo "Icon=splatpc-builder"
            echo "Comment=Native Splatoon PC Port Builder and Setup"
            echo "Categories=Game;Development;Utility;"
            echo "Terminal=false"
            echo "StartupNotify=true"
          } > "$APPDIR/splatpc-builder.desktop"

          cp Builder/ui/icon.png "$APPDIR/splatpc-builder.png"
          cp Builder/ui/icon.png "$APPDIR/.DirIcon"
          cp Builder/ui/icon.png "$APPDIR/usr/share/icons/hicolor/128x128/apps/splatpc-builder.png"

          ARCH=x86_64 appimagetool -n "$APPDIR" SplatPC-Builder-x86_64.AppImage
          chmod +x SplatPC-Builder-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: splatpc-builder-linux
          path: SplatPC-Builder-x86_64.AppImage
          retention-days: 1

  build-windows:
    name: Build Windows Standalone EXE
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: Builder/go.sum

      - name: Add MinGW64 to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Integrity Manifest
        id: win_version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          python scripts/integrity.py --make "$tag"

      - name: Bundle Builder Assets
        shell: pwsh
        run: |
          python scripts/bundle_builder_assets.py

      - name: Build SplatPC-Builder.exe
        shell: pwsh
        run: |
          cd Builder
          $env:CGO_ENABLED = "1"
          go generate ./winres.go
          $ldflags = "-H windowsgui -s -w"
          $tag = "${{ steps.win_version.outputs.tag }}"
          if ($tag) { $ldflags += " -X splatpc-builder/engine.ReleaseTag=$tag" }
          go build -trimpath -ldflags="$ldflags" -o ../SplatPC-Builder.exe .

      - name: Package Windows release zip
        shell: pwsh
        run: |
          Compress-Archive -Force -Path SplatPC-Builder.exe, recomplauncher.json -DestinationPath SplatPC-Builder-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: splatpc-builder-windows
          path: SplatPC-Builder-Windows-x64.zip
          retention-days: 1

  publish:
    name: Publish Builder Binaries to Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: splatpc-builder-linux
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: splatpc-builder-windows
          path: release-assets

      - name: Determine Release Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v-dev-${GITHUB_SHA::7}")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Integrity Manifest
        run: |
          python3 scripts/integrity.py --make "${{ steps.tag.outputs.tag }}"
          cp scripts/integrity-manifest.txt release-assets/integrity-manifest.txt

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum SplatPC-Builder-x86_64.AppImage SplatPC-Builder-Windows-x64.zip > SHA256SUMS.txt
          cp SHA256SUMS.txt SHA256SUMS-BUILDER.txt
          cat SHA256SUMS.txt

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Splatoon 1 PC Port ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## SplatPC Builder

            | Platform | File | Instructions |
            |---|---|---|
            | Windows 10/11 (x64) | `SplatPC-Builder-Windows-x64.zip` | Unzip and run `SplatPC-Builder.exe` |
            | Linux (x64) | `SplatPC-Builder-x86_64.AppImage` | `chmod +x SplatPC-Builder-x86_64.AppImage && ./SplatPC-Builder-x86_64.AppImage` |

            The builder tool automatically configures prerequisites, verifies your Splatoon dump, and compiles the native PC port.
            No game files are included (you need your own dump of Splatoon).
            Works with [RecompLauncher](https://recomplauncher.com): install, set up and start the port from the launcher.
            Checksums: `SHA256SUMS.txt`.
          files: |
            release-assets/SplatPC-Builder-x86_64.AppImage
            release-assets/SplatPC-Builder-Windows-x64.zip
            release-assets/SHA256SUMS.txt
            release-assets/SHA256SUMS-BUILDER.txt
            release-assets/integrity-manifest.txt
            recomplauncher.json
